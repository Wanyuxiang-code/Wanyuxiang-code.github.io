name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: google-scholar-stats

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: rG_wEGEAAAAJ
        run: python main.py
      - uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: stats
      - name: Publish citation data
        working-directory: stats
        run: |
          cp ../google_scholar_crawler/results/gs_data{,_shieldsio}.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar citation data"
          git push origin HEAD:google-scholar-stats
