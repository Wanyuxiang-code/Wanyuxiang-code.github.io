# =============================================================================
# Site Configuration - Yuxiang's Personal Homepage
# =============================================================================

# Site Settings
title: "Yuxiang Wan | 万煜翔"
description: "Personal academic homepage of Yuxiang Wan, an undergraduate student at ZJUI, Zhejiang University."
url: "https://wanyuxiang-code.github.io"
baseurl: ""
repository: "Wanyuxiang-code/Wanyuxiang-code.github.io"

# Author Information
author:
  name: "Yuxiang Wan"
  chinese_name: "万煜翔"
  avatar: "images/skydeck_crop.jpg"
  bio: "Undergraduate @ ZJUI"
  affiliation: "Zhejiang University - UIUC Institute"
  location: "Hangzhou, China"
  email: "yuxiang.23@intl.zju.edu.cn"
  github: "Wanyuxiang-code"
  notepage: "https://yuxiangnote.netlify.app"

# Social Links
social:
  github: "https://github.com/Wanyuxiang-code"
  email: "yuxiang.23@intl.zju.edu.cn"
  notepage: "https://yuxiangnote.netlify.app"

# Google Analytics (optional)
google_analytics_id: # Add your GA ID here

# SEO Related (optional)
google_site_verification:
bing_site_verification:
baidu_site_verification:

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Kramdown Settings
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Files to Include
include:
  - _pages
  - assets

# Files to Exclude
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - node_modules
  - package.json
  - vendor

# Keep files
keep_files:
  - .git
  - .svn

# Encoding
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Timezone
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
