# 学术经历 - 包括研究经历和助教经历，按时间倒序排列
# 格式：date（时间段）, organization（机构）, role（职位）, type（类型：research/teaching）, description（描述）

- date: "2026"
  project: "RoboWild"
  topic: "Embodied Agent Benchmarking"
  organization: "XLANG Lab, The University of Hong Kong"
  role: "Research Assistant, advised by Prof. Tao Yu"
  type: "research"
  description: >
    I co-designed scenes and tasks for RoboWild, prepared 3D assets in Blender, and configured
    how objects move and collide in Isaac Sim. I also wrote evaluators to check whether a robot
    had completed each task and cross-reviewed tasks in Isaac Lab to verify scoring and simulation stability.

- date: "2025–2026"
  project: "BRISK-DLM"
  topic: "Efficient Diffusion LM Inference"
  organization: "University of Illinois Urbana-Champaign"
  role: "Undergraduate Researcher, advised by Prof. Fan Lai"
  type: "research"
  description: >
    BRISK-DLM addresses a bottleneck in parallel diffusion decoding: an early rejection can discard many proposed tokens.
    I designed and trained lightweight prefix-conditioned corrector heads that rerank candidates using the selected prefix
    and cached backbone representations, and fused their execution into the GPU decoding pipeline without extra backbone passes.
    I also led most experiments and co-wrote the manuscript. Combined with risk–reward-weighted proposal training,
    our method achieved a <strong>29.8% geometric-mean throughput gain</strong> over same-scale I-DLM at 32B
    across 18 workload–concurrency settings.

- date: "2024–2025"
  project: "ContextG"
  topic: "Graph-Structured In-Context Learning"
  organization: "AI-Net Lab, Zhejiang University"
  role: "Undergraduate Researcher, advised by Prof. Yang Yang"
  type: "research"
  description: >
    ContextG explores how relationships among demonstrations and a query can improve in-context learning.
    It builds a learnable graph over these examples and combines PageRank-based selection with hierarchical structural encoding.
    I co-developed and refined the node, path, and subgraph encodings, conducted baseline comparisons, and co-wrote the manuscript.
    Across four datasets and two language models, ContextG improved mean accuracy by 2.74 percentage points
    over the strongest baseline in each setting.

