- date: "Sep 2026"
  text: >
    <a href="https://arxiv.org/abs/2609.33390" target="_blank" rel="noopener">BRISK-DLM</a>
    speeds up diffusion language models by helping more tokens pass verification in each parallel decoding step.
    At 32B, it achieved 29.8% higher throughput on average than I-DLM across 18 serving settings.

