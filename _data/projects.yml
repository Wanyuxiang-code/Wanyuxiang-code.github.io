- title: "A Unix-like Kernel for RISC-V"
  description: >
    In a three-person team for ECE 391 (Fall 2025), we built a kernel in C and RISC-V assembly.
    It runs user programs with demand-paged Sv39 virtual memory and preemptive scheduling.
    A shell supports pipes and I/O redirection, backed by a KTFS file system and a VirtIO block driver.
  icon: "fas fa-microchip"
  tags:
    - "Operating Systems"
    - "C"
    - "RISC-V"

