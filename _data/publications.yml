- title: "RoboWild: Can Frontier Models Generalize to Robot Use in the Wild?"
  authors: "XLANG Lab (including <strong>Yuxiang Wan</strong>)"
  venue: "Preprint"
  year: "2026"
  links:
    - name: "Project page"
      url: "https://robowild.xlang.ai/"
    - name: "Paper"
      url: "https://huggingface.co/datasets/xlangai/RoboWild/blob/main/RoboWild.pdf"
    - name: "Code"
      url: "https://github.com/xlang-ai/RoboWild"
  description: >
    Can a vision-language model guide a robot through everyday tasks such as packing eggs into a carton
    or leveling a chair with a wooden block? RoboWild tests this across 38 simulated scenes, with
    341 tasks spanning four robot embodiments. The strongest model reached 13.28% overall success.
    Even when agents chose the right object, they could grasp empty space, lose their grip, or collide
    with nearby furniture.

