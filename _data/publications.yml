- title: "RoboWild: Can Frontier Models Generalize to Robot Use in the Wild?"
  authors: "XLANG Lab"
  venue: "Preprint"
  year: "2026"
  links:
    - name: "Project page"
      url: "https://robowild.xlang.ai/"
    - name: "Paper"
      url: "https://huggingface.co/datasets/xlangai/RoboWild/blob/main/RoboWild.pdf"
    - name: "Code"
      url: "https://github.com/xlang-ai/RoboWild"
  description: >
    RoboWild measures how well frontier vision-language models can use robots to carry out instructions
    across environments and robot bodies. Its 341 tasks span 38 simulated scenes and four robot embodiments,
    testing navigation, manipulation, and physical tool use. The strongest model achieved 13.28% overall
    success. Analysis of failed attempts revealed persistent difficulties with grasping, coordinating two
    arms, and using tools.

